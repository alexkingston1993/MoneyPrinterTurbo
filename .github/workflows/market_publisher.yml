name: Autonomous Live Market Media & News Engine

on:
  schedule:
    # 5 Daily Slots aligned with Indian Standard Time (IST = UTC + 5:30)
    # Using :03 and :33 minute offsets to avoid high-load top-of-hour GitHub Actions queue stalls
    - cron: '33 3 * * 1-5'   # 09:03 AM IST (Pre-Market / Open Brief)
    - cron: '33 5 * * 1-5'   # 11:03 AM IST (Morning Momentum & Sector Rotation)
    - cron: '03 8 * * 1-5'   # 13:33 PM IST (Mid-Day / European Cues)
    - cron: '33 10 * * 1-5'  # 16:03 PM IST (Closing Bell Wrap & Top Movers)
    - cron: '03 14 * * 1-5'  # 19:33 PM IST (Evening FII/DII Deep Dive)
    - cron: '33 5 * * 6'     # 11:03 AM IST Saturday (Weekend Masterclass)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Market slot name'
        required: false
        default: 'manual_trigger'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Verify FFmpeg and Audio Libraries
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
          echo "✓ FFmpeg & audio libs installed: $(ffmpeg -version | head -n 1)"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Restore YouTube Token
        env:
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_EN" ]; then
            mkdir -p data/youtube_tokens
            echo "$YOUTUBE_TOKEN_EN" | base64 -d > data/youtube_tokens/youtube_token_en.pickle
            echo "✓ YouTube OAuth token restored for autonomous cloud upload"
          fi

      - name: Execute Autonomous Market Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LLM_PROVIDER: "gemini"
          GEMINI_MODEL_NAME: "gemini-2.5-flash"
          VOICE_NAME: "xtts:prabhat"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_TO_PHONE: ${{ secrets.TWILIO_TO_PHONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
        run: |
          SLOT="${{ github.event.inputs.slot || 'scheduled_cron' }}"
          echo "🚀 Running autonomous market cycle for slot: $SLOT"
          python -m app.services.autonomous_scheduler --now "$SLOT"

      - name: Commit and Push New Articles to GitHub
        run: |
          git config --global user.name "Market Pulse Bot"
          git config --global user.email "bot@marketpulse.media"
          git add content/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "feat(market): autonomous market news release [skip ci]" || true
            for retry in 1 2 3; do
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; git merge -X ours origin/main -m "merge: resolve content sync" || true; }
              if git push origin main; then
                echo "✓ Successfully pushed updated articles"
                break
              fi
              sleep 5
            done
          fi

